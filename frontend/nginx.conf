server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Запросы /api/... уходят на контейнер backend (имя "backend" — это имя сервиса в docker-compose.yml).
    # Браузер видит один адрес, поэтому CORS не нужен.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Всё остальное — файлы React-приложения; неизвестные пути отдают index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
